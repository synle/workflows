# Common Build and Commit with NodeJS and Build.sh
#
# Full Node.js CI pipeline: install deps, build, format, commit artifacts, test,
# and optionally deploy to GitHub Pages.
#
# Each step uses a priority-based detection to find the right command:
#   Build:  Makefile → build.sh → npm run build (from package.json) → skip
#   Format: Makefile → npm run format (from package.json) → remote format.sh fallback
#   Test:   Makefile → test.sh → npm run test-ci → npm run test:ci → npm run test → skip
#
# Opt-in amendment validates before rewriting branch pushes and prefers test:coverage
# after test-ci/test:ci. The default mode retains separate bot commits and tolerant tests.
# Produces a Job Summary table at the end showing pass/fail/skip status for each step.

name: Common Build and Commit with NodeJS and Build.sh

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        required: false
        default: "24.x"
      amend-triggering-commit:
        description: "Amend build/format changes into the triggering branch push after validation; PRs and dispatches never commit"
        type: boolean
        required: false
        default: false
      early-exit-on-commit:
        description: "Exit with failure after committing so the workflow re-triggers with updated code"
        type: boolean
        required: false
        default: false
      ignore-commit-pattern:
        description: "Extended regex pattern matching git diff paths (no ./ prefix) to exclude from commit (skip commit if only these change)"
        type: string
        required: false
        default: "^dist/sw.*\\.js$"
      deploy-to-pages:
        description: "Deploy to GitHub Pages after build (only on push to main/master)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Node ${{ inputs.node-version }} - Build and Commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      is_os_darwin_mac: 0
      is_os_window: 0
      is_os_wsl: 0
      is_os_ubuntu: 1
      is_os_chromeos: 0
      is_os_mingw64: 0
      is_os_android_termux: 0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.amend-triggering-commit && github.sha || github.head_ref || github.ref_name }}
          # Full ancestry is required when replacing the source commit's tree.
          fetch-depth: 0
          persist-credentials: ${{ !inputs.amend-triggering-commit || github.event_name == 'push' }}

      - name: Setup Node.js
        id: setup-node
        continue-on-error: ${{ !inputs.amend-triggering-commit }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Dependencies
        id: install-deps
        continue-on-error: ${{ !inputs.amend-triggering-commit }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "::group::🚀 Running npm ci @ $(date '+%Y-%m-%d %H:%M:%S')"
            npm ci || npm install --no-fund --prefer-offline
            echo "::endgroup::"
          elif [ -f package.json ]; then
            echo "::group::🚀 Running npm install @ $(date '+%Y-%m-%d %H:%M:%S')"
            npm install --no-fund --prefer-offline
            echo "::endgroup::"
          else
            echo "⏭️ Skipping. No package.json found."
          fi

      - name: Build
        id: build
        shell: bash
        run: |
          if [ -f Makefile ]; then
            echo "::group::🔨 Running make build @ $(date '+%Y-%m-%d %H:%M:%S')"
            make build
            echo "::endgroup::"
          elif [ -f build.sh ]; then
            echo "::group::🔨 Running build.sh @ $(date '+%Y-%m-%d %H:%M:%S')"
            bash build.sh
            echo "::endgroup::"
          elif [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            echo "::group::🔨 Running npm run build @ $(date '+%Y-%m-%d %H:%M:%S')"
            npm run build
            echo "::endgroup::"
          else
            echo "⏭️ Skipping build (no Makefile, build.sh, or npm build script found)"
          fi

      - name: Format Code
        id: format
        continue-on-error: ${{ !inputs.amend-triggering-commit }}
        shell: bash
        run: |
          if [ -f Makefile ]; then
            echo "::group::✨ Running make format @ $(date '+%Y-%m-%d %H:%M:%S')"
            make format
            echo "::endgroup::"
          elif [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.format ? 0 : 1)"; then
            echo "::group::✨ Running npm run format @ $(date '+%Y-%m-%d %H:%M:%S')"
            npm run format
            echo "::endgroup::"
          else
            echo "::group::✨ Running format.sh @ $(date '+%Y-%m-%d %H:%M:%S')"
            curl -fsSL "https://github.com/synle/workflows/blob/main/format.sh?raw=1" | bash
            echo "::endgroup::"
          fi

      - name: Check for Meaningful Changes
        id: check-changes
        shell: bash
        env:
          IGNORE_COMMIT_PATTERN: ${{ inputs.ignore-commit-pattern }}
        run: |
          changed_files=$(git diff --name-only && git diff --name-only --cached && git ls-files --others --exclude-standard)
          meaningful_files=$(echo "$changed_files" | grep -v '^$' | grep -v -E -- "$IGNORE_COMMIT_PATTERN" || true)
          if [ -z "$meaningful_files" ]; then
            echo "Only ignored files changed, skipping commit."
            echo "should_commit=false" >> "$GITHUB_OUTPUT"
            git checkout -- . 2>/dev/null || true
          else
            echo "Meaningful changes detected:"
            echo "$meaningful_files"
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Changes
        if: ${{ !inputs.amend-triggering-commit && steps.check-changes.outputs.should_commit != 'false' }}
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          message: "CI / CD - Build artifacts and format code"
          default_author: github_actions

      - name: Lint
        id: lint
        if: inputs.amend-triggering-commit
        shell: bash
        run: |
          if [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "⏭️ Skipping lint (no npm lint script found)"
          fi

      - name: Test
        id: test
        continue-on-error: ${{ !inputs.amend-triggering-commit }}
        shell: bash
        env:
          AMEND_TRIGGERING_COMMIT: ${{ inputs.amend-triggering-commit }}
        run: |
          if [ -f Makefile ]; then
            echo "::group::🧪 Running make test @ $(date '+%Y-%m-%d %H:%M:%S')"
            make test
            echo "::endgroup::"
          elif [ -f test.sh ]; then
            echo "::group::🧪 Running test.sh @ $(date '+%Y-%m-%d %H:%M:%S')"
            bash test.sh
            echo "::endgroup::"
          elif [ -f package.json ]; then
            TEST_SCRIPT=""
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test-ci'] ? 0 : 1)"; then
              TEST_SCRIPT="test-ci"
            elif node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test:ci'] ? 0 : 1)"; then
              TEST_SCRIPT="test:ci"
            elif [ "$AMEND_TRIGGERING_COMMIT" = "true" ] && node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test:coverage'] ? 0 : 1)"; then
              TEST_SCRIPT="test:coverage"
            elif node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test'] ? 0 : 1)"; then
              TEST_SCRIPT="test"
            fi
            if [ -n "$TEST_SCRIPT" ]; then
              echo "::group::🧪 Running npm run $TEST_SCRIPT @ $(date '+%Y-%m-%d %H:%M:%S')"
              npm run "$TEST_SCRIPT"
              echo "::endgroup::"
            else
              echo "⏭️ Skipping test (no test script found in package.json)"
            fi
          else
            echo "⏭️ Skipping test (no Makefile, test.sh, or package.json found)"
          fi

      - name: Amend triggering commit
        id: amend
        if: inputs.amend-triggering-commit && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && steps.check-changes.outputs.should_commit == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to amend"
            exit 0
          fi
          # Preserve the source commit's author, message, and parent history.
          git commit --amend --no-edit
          # Reject a stale run even when a fetch has advanced origin's tracking ref.
          git push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin "HEAD:$GITHUB_REF"

      - name: Early Exit on Commit
        if: ${{ !inputs.amend-triggering-commit && inputs.early-exit-on-commit && steps.commit.outputs.committed == 'true' }}
        shell: bash
        run: |
          echo "Changes were committed. Exiting early to re-trigger the workflow with updated code."
          exit 1

      - name: Upload Pages artifact
        if: inputs.deploy-to-pages && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: inputs.deploy-to-pages && github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job Summary
        if: ${{ always() }}
        shell: bash
        run: |
          function get_status_icon() {
            case "$1" in
              success)  echo ":white_check_mark: Passed" ;;
              failure)  echo ":x: Failed" ;;
              skipped)  echo ":fast_forward: Skipped" ;;
              *)        echo ":grey_question: Unknown" ;;
            esac
          }

          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Setup Node.js | $(get_status_icon '${{ steps.setup-node.outcome }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Install Dependencies | $(get_status_icon '${{ steps.install-deps.outcome }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $(get_status_icon '${{ steps.build.outcome }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Format Code | $(get_status_icon '${{ steps.format.outcome }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit Changes | $(get_status_icon '${{ steps.commit.outcome }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | $(get_status_icon '${{ steps.lint.outcome }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | $(get_status_icon '${{ steps.test.outcome }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Amend triggering commit | $(get_status_icon '${{ steps.amend.outcome }}') |" >> $GITHUB_STEP_SUMMARY
